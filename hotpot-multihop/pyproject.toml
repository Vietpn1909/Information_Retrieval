[project]
name = "hotpot-multihop"
version = "0.1.0"
description = "Truy xuất đa bước trên HotpotQA — từ chỉ mục ngược đến truy xuất lặp có dẫn hướng (IT5411, HUST)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==5.1.0",
    "numpy==2.4.6",
    "nltk==3.10.4",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
    "pytrec-eval-terrier==0.5.11",
]

[project.optional-dependencies]
dense = ["sentence-transformers==6.2.0", "faiss-cpu==1.15.1"]
ner = ["spacy==3.8.16"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: cần dữ liệu thật trong data/ (tự skip nếu chưa chạy build_corpus.py)"]
